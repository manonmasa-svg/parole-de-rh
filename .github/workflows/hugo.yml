name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Publie les articles programmes et rafraichit l agenda. GitHub retarde ou saute parfois les taches
    # planifiees (plusieurs heures en novembre 2026) : on multiplie les creneaux, toutes les 30 minutes
    # de 6 h 13 a 10 h 43 UTC (7 h 13 a 11 h 43 a Paris en hiver, 8 h 13 a 12 h 43 en ete).
    # Minutes 13 et 43 : les heures pile sont les plus encombrees chez GitHub.
    - cron: "13,43 6-10 * * *"
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "Envoyer TOUTES les adresses du sitemap a IndexNow"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_extended_0.167.0_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        # L adresse du site vient de baseURL dans hugo.toml (https://parole-de-rh.fr/)
        run: hugo --gc --minify

      - name: IndexNow, liste des adresses nouvelles ou modifiees
        # Compare le sitemap en ligne (encore l ancienne version) avec celui qui vient d etre genere
        continue-on-error: true
        run: python3 .github/scripts/indexnow.py diff public indexnow-urls.txt ${{ inputs.indexnow_all && '--all' || '' }}

      - name: IndexNow, conserver la liste pour l envoi apres deploiement
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Previent Bing (et les autres moteurs IndexNow) une fois le site en ligne. Un echec ici ne casse pas le site.
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recuperer la liste
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls

      - name: Envoyer a IndexNow
        run: python3 .github/scripts/indexnow.py submit indexnow-urls.txt
