name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Publie les articles programmes et rafraichit l agenda. GitHub retarde ou saute parfois les taches
    # planifiees (plusieurs heures en novembre 2026) : on multiplie les creneaux, toutes les 30 minutes
    # de 6 h 13 a 10 h 43 UTC (7 h 13 a 11 h 43 a Paris en hiver, 8 h 13 a 12 h 43 en ete).
    # Minutes 13 et 43 : les heures pile sont les plus encombrees chez GitHub.
    - cron: "13,43 6-10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_extended_0.167.0_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        # L adresse du site vient de baseURL dans hugo.toml (https://parole-de-rh.fr/)
        run: hugo --gc --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
