<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
    <script>document.documentElement.classList.add('js');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }} | {{ .Site.Params.tagline }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

    {{ partial "seo-head.html" . }}

    <meta name="theme-color" content="#FFFFFF">

    <!-- Polices hebergees sur le site (aucun appel a Google) : precharge des deux polices principales -->
    <link rel="preload" href="{{ "fonts/dmsans-normal-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ "fonts/newsreader-normal-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>

    {{ with resources.Get "css/main.css" }}
    {{ $css := . | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}">
    {{ end }}
</head>
<body{{ if and .IsPage (eq .Section "blog") }} class="has-read-progress"{{ end }}>
    <a href="#main-content" class="skip-to-content">{{ T "skip" }}</a>
    {{ if and .IsPage (eq .Section "blog") }}<div class="read-progress" aria-hidden="true"><span></span></div>{{ end }}

    {{ partial "header.html" . }}

    <main id="main-content">
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    <button type="button" class="to-top" aria-label="{{ T "backToTop" }}" tabindex="-1">
        <svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true"><circle class="to-top-ring" cx="22" cy="22" r="20" pathLength="100"/><path d="M22 29V15M15.5 21.5L22 15l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
    </button>

    <script>
    /* Effets au defilement (22 octobre 2026) : barre compacte, bouton haut de page avec anneau de progression,
       chiffres qui comptent a l'apparition. Tout est desactive ou instantane si l'utilisateur limite les animations. */
    (function() {
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var header = document.querySelector('.site-header');
        var mini = document.querySelector('.minibar');
        var miniBar = mini && mini.querySelector('.minibar-progress');
        var top = document.querySelector('.to-top');
        var ring = top && top.querySelector('.to-top-ring');
        var ticking = false;
        function update() {
            var y = window.scrollY;
            var max = document.documentElement.scrollHeight - window.innerHeight;
            var p = max > 0 ? Math.min(1, y / max) : 0;
            if (mini && header) {
                var on = y > header.offsetHeight + 40;
                mini.classList.toggle('is-on', on);
                if (on) { mini.removeAttribute('inert'); } else { mini.setAttribute('inert', ''); }
                if (miniBar) { miniBar.style.transform = 'scaleX(' + p + ')'; }
            }
            if (top) {
                var show = y > window.innerHeight * 0.8;
                top.classList.toggle('is-on', show);
                top.tabIndex = show ? 0 : -1;
                if (ring) { ring.style.strokeDashoffset = String(100 - p * 100); }
            }
            ticking = false;
        }
        window.addEventListener('scroll', function() {
            if (!ticking) { ticking = true; requestAnimationFrame(update); }
        }, { passive: true });
        update();
        if (top) {
            top.addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
                var logo = document.querySelector('.site-logo');
                if (logo) { logo.focus({ preventScroll: true }); }
            });
        }

        var nums = document.querySelectorAll('.figure-n[data-count]');
        if (!nums.length || reduce || !('IntersectionObserver' in window)) { return; }
        var io = new IntersectionObserver(function(entries) {
            entries.forEach(function(e) {
                if (!e.isIntersecting) { return; }
                io.unobserve(e.target);
                var el = e.target, end = parseInt(el.dataset.count, 10) || 0, t0 = null;
                function step(t) {
                    if (!t0) { t0 = t; }
                    var k = Math.min(1, (t - t0) / 1200);
                    el.textContent = String(Math.round(end * (1 - Math.pow(1 - k, 3))));
                    if (k < 1) { requestAnimationFrame(step); }
                }
                el.textContent = '0';
                requestAnimationFrame(step);
            });
        }, { threshold: 0.6 });
        nums.forEach(function(n) { io.observe(n); });
    })();
    </script>

    <script>
    /* Tableaux plus larges que l'ecran : affiche l'indication de defilement */
    (function() {
        function mark() {
            document.querySelectorAll('.table-scroll').forEach(function(w) {
                var t = w.querySelector('table');
                w.classList.toggle('is-wide', t.scrollWidth > t.clientWidth + 1);
            });
        }
        mark();
        window.addEventListener('load', mark);
        window.addEventListener('resize', mark);
    })();
    </script>

    <script>
    /* Apparition douce des sections au defilement (desactivee si l'utilisateur limite les animations) */
    (function() {
        var els = document.querySelectorAll('.reveal');
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!els.length) { return; }
        if (reduce || !('IntersectionObserver' in window)) {
            els.forEach(function(el) { el.classList.add('is-visible'); });
            return;
        }
        var io = new IntersectionObserver(function(entries) {
            entries.forEach(function(e) {
                if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
            });
        }, { rootMargin: '0px 0px -10% 0px' });
        els.forEach(function(el) { io.observe(el); });
    })();

    /* Barre de progression de lecture sur les articles */
    (function() {
        var bar = document.querySelector('.read-progress span');
        var article = document.querySelector('.article-content');
        if (!bar || !article) { return; }
        var ticking = false;
        function update() {
            var r = article.getBoundingClientRect();
            var total = r.height - window.innerHeight;
            var p = total > 0 ? Math.min(1, Math.max(0, -r.top / total)) : 1;
            bar.style.transform = 'scaleX(' + p + ')';
            ticking = false;
        }
        window.addEventListener('scroll', function() {
            if (!ticking) { ticking = true; requestAnimationFrame(update); }
        }, { passive: true });
        update();
    })();
    </script>
</body>
</html>
