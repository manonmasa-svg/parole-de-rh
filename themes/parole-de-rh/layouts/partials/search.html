{{/* Moteur de recherche interne (17 octobre 2026). Bouton dans l'en-tete, panneau sous la navigation.
     Index : /index.json (FR) et /en/index.json (EN), genere par layouts/_default/home.json.
     Recherche sans service externe, insensible aux accents et a la casse. */}}
<div class="search-panel" id="search-panel" hidden
    data-index="{{ "index.json" | relLangURL }}"
    data-none="{{ T "searchNone" }}" data-single="{{ T "searchOne" }}" data-other="{{ T "searchOther" }}" data-error="{{ T "searchError" }}">
    <div class="search-inner">
        <form class="search-form" role="search" action="#" onsubmit="return false">
            <label for="search-input" class="visually-hidden">{{ T "searchLabel" }}</label>
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input type="search" id="search-input" class="search-input" autocomplete="off" spellcheck="false" placeholder="{{ T "searchPlaceholder" }}">
            <button type="button" class="search-close" aria-label="{{ T "searchClose" }}"><span aria-hidden="true">✕</span></button>
        </form>
        <p class="search-status" aria-live="polite">{{ T "searchHint" }}</p>
        <ol class="search-results"></ol>
    </div>
</div>
