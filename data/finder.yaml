# Les cinq critères affichés sous le questionnaire (repris des comparatifs SIRH et paie)
criteria:
  - title: { fr: "Les modules réellement utiles", en: "The modules you actually need" }
    text: { fr: "Lister les tâches à outiller avant de comparer : congés, temps, entretiens, recrutement, paie.", en: "List the tasks to equip before comparing: leave, time, reviews, recruitment, payroll." }
  - title: { fr: "La paie : intégrée, connectée ou déléguée", en: "Payroll: built in, connected or outsourced" }
    text: { fr: "Certains SIRH produisent la paie, d'autres préparent les variables pour un logiciel de paie ou un cabinet.", en: "Some HRIS run payroll, others prepare the variables for payroll software or an accounting firm." }
  - title: { fr: "La DSN et la convention collective", en: "The DSN and the collective agreement" }
    text: { fr: "Vérifier que la convention collective de l'entreprise est prise en charge et que la DSN est produite.", en: "Check that the company's collective agreement is supported and that the DSN is produced." }
  - title: { fr: "Les données personnelles", en: "Personal data" }
    text: { fr: "Un logiciel RH traite des données de salariés : accès limités, traçabilité, durées de conservation.", en: "HR software processes employee data: restricted access, logging, retention periods." }
  - title: { fr: "Le coût total", en: "The total cost" }
    text: { fr: "Additionner abonnement, modules, mise en place, formation et durée d'engagement.", en: "Add up subscription, modules, set-up, training and minimum term." }

