      fr: "Suite RH pour les grandes structures, hébergement en Europe et certification ISO 27001, paie dans un logiciel distinct (Cegid Payroll). Prix sur demande."
      en: "HR suite for large organisations, hosting in Europe and ISO 27001 certification, payroll in a separate product (Cegid Payroll). Price on request."
