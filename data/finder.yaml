      fr: "À partir de 4,20 € HT par collaborateur et par mois (offre Business, 11 à 500 collaborateurs), essai gratuit de 30 jours, sans engagement, hébergement annoncé en France. Offre Starter de 1 à 10 collaborateurs via le cabinet d'expertise comptable."
      en: "From €4.20 excl. VAT per employee per month (Business plan, 11 to 500 employees), 30-day free trial, no commitment, hosting stated as based in France. Starter plan for 1 to 10 employees through the accounting firm."
    checked: { fr: "Relevé du 21 octobre 2026", en: "Checked on 21 October 2026" }
  - name: Factorial
    needs: { sirh: 3, temps: 3 }
    sizes: [s1, s2, s3, s4]
    flags: { price: true, flex: true }
    target: { fr: "Toutes tailles d'entreprise", en: "Companies of all sizes" }
    fact:
      fr: "À partir de 6,90 € par utilisateur et par mois, essai gratuit. Gestion des temps, préparation de la paie et périmètre étendu à la finance et à l'informatique."
      en: "From €6.90 per user per month, free trial. Time management, payroll preparation and a scope extended to finance and IT."
