      en: "Payroll is the core of the offer: payslips, DSN and event-based returns. €20 to €30 excl. VAT per employee per month plus a €49 subscription, or €26 with no subscription for a first payroll, plans with no commitment. Payroll service run by its experts, expense reports as an option at €3 per employee per month, ISO 27001 certification and data hosted in France."
    checked: { fr: "Relevé des 12 et 29 octobre et des 5 et 16 novembre 2026", en: "Checked on 12 and 29 October and 5 and 16 November 2026" }
