  bio:
    fr: "Camille Lefort est un nom de plume de la rédaction de Parole de RH. Cette signature couvre le recrutement, l'intégration des nouveaux salariés et la marque employeur, à partir des textes et des fiches officielles."
    en: "Camille Lefort is a pen name used by the Parole de RH editorial team. This byline covers recruitment, new hire onboarding and employer branding, based on official texts and government guidance."
