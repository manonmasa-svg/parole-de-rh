# Auteurs de Parole de RH (bilingue FR/EN)
# Hugo lit ce fichier via `.Site.Data.authors`.
#
# Ce sont des NOMS DE PLUME de la redaction, un par perimetre editorial.
# Regle : les bios decrivent uniquement le perimetre couvert sur le site.
# Ne JAMAIS y ajouter de diplome, d'annees d'experience, d'ancien employeur
# ou de profil LinkedIn : ce seraient des inventions.
#
# L'ID est utilise dans le frontmatter des articles (`author: camille-lefort`).
# `topics` sert a la selection automatique de l'auteur dans /create-article.
# `expertise` alimente le bloc auteur et le schema.org Person -> knowsAbout.
# Pas d'avatar : le theme affiche un carre avec l'initiale.

