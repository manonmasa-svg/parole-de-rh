# Auteurs invites (tribunes) : personnes reelles, bio fournie par l'auteur et reprise telle quelle.
# `guest: true` les exclut de la liste « La redaction » (page A propos) et le JSON-LD les rattache
# a leur propre organisation (`employer`), pas a Parole de RH. Pas de `topics` : jamais choisis
# automatiquement par /create-article.

franck-prime:
  id: franck-prime
  name: Franck PRIME
  type: person
  guest: true
  employer: OPC TRAINING
  avatar: ""
  linkedinUrl: ""
  jobTitle:
    fr: Entrepreneur, spécialiste de l'événementiel professionnel et de la formation
    en: Entrepreneur, specialist in professional events and training
  role:
    fr: Auteur invité, entrepreneur dans l'événementiel et la formation
    en: Guest author, entrepreneur in events and training
  bio:
    fr: "Franck PRIME est entrepreneur et spécialiste de l'organisation de salons professionnels, du développement commercial et de la formation. Fort de plus de trente années d'expérience, il a participé à la création et au développement de manifestations professionnelles en France et à l'international, notamment dans les domaines du marketing digital, de l'e-commerce, des ressources humaines et du luxe. Il a contribué à environ 350 organisations dans 15 pays, pour quelque quatre millions de visiteurs cumulés. Son parcours comprend notamment les événements Digital RH Meeting et Digital Luxe Meeting ainsi que le développement d'ALGO GROUPE, d'OPC TRAINING et d'ALGO Franchise. Il partage aujourd'hui son expérience autour du développement des compétences, de la formation professionnelle, de l'entrepreneuriat et des passerelles entre les métiers."
    en: "Franck PRIME is an entrepreneur and specialist in organising trade shows, business development and training. With more than thirty years of experience, he has helped create and develop professional events in France and abroad, particularly in digital marketing, e-commerce, human resources and luxury. He has contributed to around 350 events in 15 countries, with some four million visitors in total. His career includes the Digital RH Meeting and Digital Luxe Meeting events and the development of ALGO GROUPE, OPC TRAINING and ALGO Franchise. He now shares his experience on skills development, professional training, entrepreneurship and bridges between professions."
  expertise:
    fr: ["Événementiel", "Formation professionnelle"]
    en: ["Events industry", "Professional training"]
  topics: []
