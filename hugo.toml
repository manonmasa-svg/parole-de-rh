[params]
  default_og_image = "/images/og-default.jpg"
  logo = "/favicon-512.png"
  founding_year = "2026"
  contact_email = "contact@parole-de-rh.fr"
  expertise = ["Ressources humaines", "Recrutement", "Paie", "Droit social", "Formation professionnelle", "Management", "QVCT", "SIRH"]
  og_locale_alternate = "en_US"
  # Images des 4 tuiles de rubriques de l accueil, dans l ordre du menu principal
  home_tiles = ["/images/rubriques/actualites-rh.jpg", "/images/rubriques/logiciels-rh.jpg", "/images/rubriques/comparatifs.jpg", "/images/rubriques/definitions-rh.jpg"]
  home_tiles_credit = "Redd Francisco, path digital, Van Tay Media, Pisit Heng"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]

[related]
  includeNewer = true
  threshold = 80
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark.renderer]
    unsafe = true

# Contenu FR a la racine de content/, contenu EN dans content/en/
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
    files = ["! en/**"]
    [module.mounts.sites.matrix]
      languages = ["fr"]
  [[module.mounts]]
    source = "content/en"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["en"]
