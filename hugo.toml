baseURL = "https://parole-de-rh.fr/"
title = "Parole de RH"
theme = "parole-de-rh"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
removePathAccents = true
enableRobotsTXT = false

[taxonomies]
  category = "categories"
  tag = "tags"

[languages]
  [languages.fr]
    locale = "fr-FR"
    label = "Français"
    weight = 1
    title = "Parole de RH"
    [languages.fr.params]
      description = "Parole de RH décrypte l'actualité des ressources humaines : recrutement, paie, droit social, formation, management, QVCT et logiciels RH, à partir de sources officielles."
      tagline = "L'actualité RH décryptée, sources officielles à l'appui"

  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 2
    title = "Parole de RH"
    [languages.en.params]
      description = "Parole de RH explains French human resources news: recruitment, payroll, employment law, training, management, workplace wellbeing and HR software, based on official sources."
      tagline = "French HR news explained, backed by official sources"

